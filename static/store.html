<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI SURVIVOR — Digital Tools Store (Pay via UPI)</title>
  <style>
    :root { --bg:#090d16; --card:#121927; --border:#24324a; --text:#f1f5f9; --muted:#94a3b8; --green:#10b981; --blue:#3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 26px 16px; }
    .wrap { max-width: 1050px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    h1 { font-size: 1.9rem; margin-bottom: 8px; }
    p.lead { color: var(--muted); font-size: 0.98rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .tag { display: inline-block; background: rgba(59,130,246,0.18); color: var(--blue); font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-bottom: 10px; }
    .title { font-size: 1.08rem; font-weight: 700; margin-bottom: 8px; }
    .pitch { color: var(--muted); font-size: 0.88rem; line-height: 1.45; margin-bottom: 16px; }
    .price-row { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); }
    .price { font-size: 1.4rem; font-weight: 800; color: var(--green); }
    .btn { background: var(--green); color: #042117; border: none; padding: 9px 15px; border-radius: 7px; font-weight: 700; cursor: pointer; font-size: 0.88rem; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); align-items:center; justify-content:center; padding:16px; }
    .modal-box { background:var(--card); border:1px solid var(--border); border-radius:14px; max-width:410px; width:100%; padding:22px; text-align:center; }
    input { width:100%; background:#0b0f17; color:var(--text); border:1px solid var(--border); padding:10px; border-radius:7px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>⚡ AI SURVIVOR Digital Tools Store</h1>
      <p class="lead">Production Python automation tools & business kits built by AI agents. Pay via any UPI app (FamPay / GPay / PhonePe).</p>
    </header>
    <div class="grid" id="catalog">Loading products...</div>
  </div>

  <div class="modal" id="payModal">
    <div class="modal-box">
      <h3 id="mTitle" style="margin-bottom:6px;"></h3>
      <div id="mPrice" style="color:var(--green); font-size:1.3rem; font-weight:800; margin-bottom:10px;"></div>
      <img id="mQr" src="" alt="UPI QR" style="width:190px; height:190px; border-radius:8px; background:#fff; padding:6px;" />
      <div style="margin-top:8px; font-size:0.85rem;">UPI ID: <strong id="mUpi"></strong></div>
      <a id="mDeepLink" href="#" style="display:inline-block; margin-top:8px; color:var(--blue); font-size:0.84rem;">Open UPI App on Mobile →</a>
      <input type="email" id="buyerEmail" placeholder="Your Email (for receipt)" />
      <input type="text" id="utrInput" placeholder="Enter 12-digit UPI UTR / Ref Number" />
      <button class="btn" style="width:100%; margin-top:12px;" onclick="submitUtr()">Verify Payment & Unlock File</button>
      <div id="statusBox" style="margin-top:12px; font-size:0.85rem; color:#f59e0b;"></div>
      <button onclick="closeModal()" style="margin-top:12px; background:transparent; color:var(--muted); border:none; cursor:pointer;">Close</button>
    </div>
  </div>

  <script>
    let currentProduct = null;
    let pollTimer = null;

    async function loadStore() {
      const res = await fetch("/api/store/catalog");
      const data = await res.json();
      const box = document.getElementById("catalog");
      if (!data.products || data.products.length === 0) {
        box.innerHTML = "<p style='color:#94a3b8;'>New AI tools are compiling. Refresh in 30 seconds.</p>";
        return;
      }
      box.innerHTML = data.products.map(p => `
        <div class="card">
          <div>
            <span class="tag">${p.artifact_type}</span>
            <div class="title">${p.file_name}</div>
            <div class="pitch">${p.pitch_copy}</div>
          </div>
          <div class="price-row">
            <div>
              <div class="price">₹${p.price_inr.toFixed(0)}</div>
              <div style="font-size:0.75rem; color:#94a3b8;">By ${p.built_by} • Sold: ${p.units_sold}</div>
            </div>
            <button class="btn" onclick='openPay(${JSON.stringify(p)})'>Pay via UPI →</button>
          </div>
        </div>
      `).join("");
    }

    function openPay(p) {
      currentProduct = p;
      document.getElementById("mTitle").textContent = p.file_name;
      document.getElementById("mPrice").textContent = "Pay ₹" + p.price_inr.toFixed(0);
      document.getElementById("mQr").src = p.qr_url;
      document.getElementById("mUpi").textContent = p.upi_id;
      document.getElementById("mDeepLink").href = p.upi_uri;
      document.getElementById("statusBox").textContent = "";
      document.getElementById("payModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("payModal").style.display = "none";
      if (pollTimer) clearInterval(pollTimer);
    }

    async function submitUtr() {
      const email = document.getElementById("buyerEmail").value.trim();
      const utr = document.getElementById("utrInput").value.trim();
      if (!email || utr.length < 6) {
        alert("Please enter your email and valid UPI UTR reference number.");
        return;
      }
      const res = await fetch("/api/store/claim-upi", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ artifact_id: currentProduct.id, buyer_email: email, utr_number: utr })
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.detail || "Submission failed");
        return;
      }
      if (data.download_url) {
        document.getElementById("statusBox").innerHTML = `<a class="btn" href="${data.download_url}">⬇️ Download ${currentProduct.file_name}</a>`;
        return;
      }
      document.getElementById("statusBox").textContent = "⏳ Verifying UTR (" + data.order_id + ")... Keep this window open, download link will appear automatically.";
      pollTimer = setInterval(async () => {
        const st = await fetch(`/api/store/order-status/${data.order_id}`);
        const sdata = await st.json();
        if (sdata.status === "PAID_DELIVERED" && sdata.download_url) {
          clearInterval(pollTimer);
          document.getElementById("statusBox").innerHTML = `<a class="btn" href="${sdata.download_url}">✅ Verified! Download ${currentProduct.file_name}</a>`;
        }
      }, 4000);
    }

    loadStore();
  </script>
</body>
</html>
